<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="nota">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#8fb3ae">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/icon-sage.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icon-sage.png">
  <script>(function(){var P=[{n:'terra',h:'#cd7b5f'},{n:'olive',h:'#6e7a4e'},{n:'rose',h:'#c4708a'},{n:'lavender',h:'#9b8fc4'},{n:'blue',h:'#6b9ab8'},{n:'sage',h:'#8fb3ae'}];var c;try{var s=localStorage.getItem('rfmss_pal');if(s)c=JSON.parse(s);}catch(x){}if(!c)c=P[Math.floor(Math.random()*P.length)];var q=document.querySelector.bind(document);var e;e=q('meta[name="theme-color"]');if(e)e.setAttribute('content',c.h);e=q('link[rel="apple-touch-icon-precomposed"]');if(e)e.setAttribute('href','/icon-'+c.n+'.png');e=q('link[rel="apple-touch-icon"]');if(e)e.setAttribute('href','/icon-'+c.n+'.png');var s=document.createElement('style');s.innerHTML='html,body,.site-header{background:'+c.h+'!important}';document.head.appendChild(s);window._pal=c;})();</script>
  <title>{% if page.title %}{{ page.title }} — {% endif %}Notas do Rafa</title>
  <style>
    *, *:before, *:after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 18px; background: #f4efe6; }
    body {
      font-family: Georgia, 'Times New Roman', serif;
      color: #1a1a1a;
      background: #f4efe6;
      min-height: 100vh;
      -webkit-text-size-adjust: 100%;
      -webkit-transition: background 0.2s, color 0.2s;
      transition: background 0.2s, color 0.2s;
    }
    body.dark { background: #1a1a1a; color: #e8e0d4; }
    a { color: #d97757; text-decoration: none; }
    a:hover, a:active { text-decoration: underline; }
    body.dark a { color: #e8956e; }

    /* ── Header ── */
    .site-header {
      background: #b2c9c3;
      padding: 20px 24px;
      border-bottom: 1px solid rgba(0,0,0,0.08);
    }
    body.dark .site-header { background: #2a3a36; border-color: rgba(255,255,255,0.06); }
    .site-header-inner {
      max-width: 680px;
      margin: 0 auto;
      display: -webkit-flex;
      display: flex;
      -webkit-align-items: baseline;
      align-items: baseline;
      -webkit-justify-content: space-between;
      justify-content: space-between;
      -webkit-flex-wrap: wrap;
      flex-wrap: wrap;
    }
    .site-header-inner > * + * { margin-left: 16px; }
    .site-name {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 1.3rem;
      font-weight: 700;
      color: #1a1a1a;
      letter-spacing: -0.3px;
    }
    body.dark .site-name { color: #e8e0d4; }
    .site-nav {
      display: -webkit-flex;
      display: flex;
      -webkit-align-items: center;
      align-items: center;
    }
    .site-nav a {
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #555;
      margin-left: 16px;
    }
    body.dark .site-nav a { color: #aaa; }
    #dark-toggle {
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: none;
      border: 1px solid #555;
      color: #555;
      padding: 3px 8px;
      cursor: pointer;
      margin-left: 16px;
    }
    body.dark #dark-toggle { border-color: #aaa; color: #aaa; }

    /* ── Main ── */
    .site-main {
      max-width: 680px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    /* ── Footer ── */
    .site-footer {
      border-top: 1px solid rgba(0,0,0,0.08);
      padding: 20px 24px;
      text-align: center;
    }
    body.dark .site-footer { border-color: rgba(255,255,255,0.06); }
    .site-footer-inner {
      max-width: 680px;
      margin: 0 auto;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #999;
    }

    /* ── Post content ── */
    .post-header { margin-bottom: 36px; }
    .post-title {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 2rem;
      font-weight: 700;
      color: #1a1a1a;
      line-height: 1.2;
      letter-spacing: -0.5px;
      margin-bottom: 10px;
    }
    body.dark .post-title { color: #e8e0d4; }
    .post-meta {
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #555;
      display: -webkit-flex;
      display: flex;
      -webkit-align-items: center;
      align-items: center;
      -webkit-flex-wrap: wrap;
      flex-wrap: wrap;
    }
    body.dark .post-meta { color: #888; }
    .post-meta > * + * { margin-left: 14px; }
    .tag-link {
      color: #d97757;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .tag-link:hover { text-decoration: underline; }
    .post-divider {
      border: none;
      border-top: 1px solid rgba(0,0,0,0.12);
      margin: 32px 0;
    }
    body.dark .post-divider { border-color: rgba(255,255,255,0.1); }
    .post-body {
      font-size: 1.05rem;
      line-height: 1.8;
      color: #1a1a1a;
    }
    body.dark .post-body { color: #e8e0d4; }
    .post-body p { margin-bottom: 1.4em; }
    .post-body p:last-child { margin-bottom: 0; }
    .post-body em { font-style: italic; }
    .post-body strong { font-weight: 700; }
    .post-body blockquote {
      border-left: 3px solid #d97757;
      margin: 1.5em 0;
      padding: 4px 0 4px 20px;
      color: #555;
      font-style: italic;
    }
    body.dark .post-body blockquote { color: #aaa; }
    .post-nav {
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid rgba(0,0,0,0.08);
      display: -webkit-flex;
      display: flex;
      -webkit-justify-content: space-between;
      justify-content: space-between;
      -webkit-flex-wrap: wrap;
      flex-wrap: wrap;
    }
    body.dark .post-nav { border-color: rgba(255,255,255,0.06); }
    .post-nav > * { margin-bottom: 8px; }
    .post-nav a {
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #d97757;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a href="{{ '/' | relative_url }}" class="site-name">Notas do Rafa</a>
      <div class="site-nav">
        <a href="{{ '/tags/' | relative_url }}">tags</a>
        <button id="dark-toggle" onclick="toggleDark()">dark</button>
      </div>
    </div>
  </header>

  <main class="site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="site-footer-inner">Rafa Mass &mdash; rfmss.github.io</div>
  </footer>
  <script>
  (function() {
    var stored = localStorage.getItem('rfmss-dark');
    if (stored === 'dark') {
      document.body.className = 'dark';
      var btn = document.getElementById('dark-toggle');
      if (btn) btn.textContent = 'claro';
    }
  })();
  function toggleDark() {
    var btn = document.getElementById('dark-toggle');
    if (document.body.className === 'dark') {
      document.body.className = '';
      btn.textContent = 'dark';
      localStorage.setItem('rfmss-dark', 'light');
    } else {
      document.body.className = 'dark';
      btn.textContent = 'claro';
      localStorage.setItem('rfmss-dark', 'dark');
    }
  }
  </script>
</body>
</html>
