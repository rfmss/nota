<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="nota">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#e9e6df">
  <meta name="description" content="Notas do Rafa — diário de sobrevivência escrito durante a pandemia de 2020, em 366 cenas. Extraído do blog Fio do Verso.">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/icon-sage.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icon-sage.png">
  <script data-goatcounter="https://nota.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
  <title>{% if page.title %}{{ page.title }} — {% endif %}Notas do Rafa</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap');

    *, *:before, *:after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Mesa de leitura (cinza neutro, como o print) ── */
    html { font-size: 17px; background: #d6d6d3; }
    body {
      font-family: 'Courier Prime', 'Courier New', Courier, monospace;
      color: #111;
      background: #d6d6d3;
      min-height: 100vh;
      -webkit-text-size-adjust: 100%;
      transition: background 0.2s, color 0.2s;
    }
    body.dark { background: #101010; }
    a { color: inherit; }
    a:hover, a:active { text-decoration: underline; }

    /* ── Header discreto (fora da folha) ── */
    .site-header { padding: 18px 24px 0; }
    .site-header-inner {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px 16px;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #6d6a61;
    }
    body.dark .site-header-inner { color: #8a867a; }
    .site-name { font-weight: 700; text-decoration: none; }
    .site-nav { display: flex; align-items: center; gap: 16px; }
    .site-nav a { text-decoration: none; }
    #dark-toggle {
      font-family: inherit;
      font-size: 0.66rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: none;
      border: 1px solid currentColor;
      color: inherit;
      padding: 3px 8px;
      cursor: pointer;
    }

    /* ── A folha do roteiro ── */
    .site-main {
      max-width: 720px;
      margin: 22px auto 60px;
      padding: 0 12px;
    }
    .sheet {
      background: #fff;
      color: #111;
      box-shadow: 0 1px 2px rgba(0,0,0,0.15), 0 12px 34px rgba(0,0,0,0.14);
      /* margens de roteiro: esquerda maior (encadernação), como no padrão */
      padding: clamp(36px, 7vw, 64px) clamp(22px, 7vw, 58px) clamp(44px, 8vw, 72px) clamp(26px, 9vw, 86px);
      min-height: 80vh;
      position: relative;
    }
    body.dark .sheet {
      background: #191919;
      color: #ddd8cc;
      box-shadow: 0 12px 34px rgba(0,0,0,0.6);
    }
    /* número de página no canto superior direito */
    .page-num {
      position: absolute;
      top: clamp(14px, 3vw, 26px);
      right: clamp(18px, 5vw, 46px);
      font-size: 0.85rem;
    }

    /* ── Tipografia de roteiro ── */
    .slugline {
      display: flex;
      align-items: baseline;
      gap: 3ch;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      font-size: 0.98rem;
      margin-top: 10px;
    }
    .slugline .slug-num-r { margin-left: auto; }
    .post-meta {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #555;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 10px;
    }
    body.dark .post-meta { color: #999; }
    .tag-link { text-decoration: none; }
    .post-divider { border: none; margin: 22px 0; }

    .post-body {
      font-size: 1rem;
      line-height: 1.75;
    }
    /* preserva as quebras originais do texto datilografado
       (diálogos com travessão, versos, respiros) */
    .post-body p { margin-bottom: 1.35em; white-space: pre-line; }
    .post-body p:last-child { margin-bottom: 0; }
    .post-body em { font-style: italic; }
    .post-body strong { font-weight: 700; }
    .post-body blockquote {
      margin: 1.6em 2ch;
      padding: 0;
      font-style: italic;
      color: #55524a;
    }
    body.dark .post-body blockquote { color: #a5a093; }
    .post-body hr {
      border: none;
      text-align: center;
      margin: 1.8em 0;
    }
    .post-body hr::after {
      content: "* * *";
      letter-spacing: 0.6em;
      color: #6d6a61;
    }

    /* ── Transições de corte ── */
    .post-nav {
      margin-top: 56px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .post-nav a { text-decoration: none; }
    .post-nav a:hover { text-decoration: underline; }
    .post-nav .cut-label { display: block; font-weight: 400; font-size: 0.66rem; color: #6d6a61; margin-bottom: 2px; }
    body.dark .post-nav .cut-label { color: #8a867a; }
    .post-nav .next { text-align: right; margin-left: auto; }

    .fade-out {
      text-align: right;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.85rem;
      margin-top: 48px;
    }

    /* ── Rodapé ── */
    .site-footer { padding: 0 24px 46px; text-align: center; }
    .site-footer-inner {
      max-width: 720px;
      margin: 0 auto;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #6d6a61;
      line-height: 2;
    }
    body.dark .site-footer-inner { color: #8a867a; }
    .site-footer-inner a { text-decoration: underline; text-underline-offset: 3px; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a href="{{ '/' | relative_url }}" class="site-name">Notas do Rafa</a>
      <nav class="site-nav">
        <a href="https://rafa.pro.br/" title="Voltar pro rafa.pro.br">&larr; rafa.pro.br</a>
        <a href="{{ '/tags/' | relative_url }}">tags</a>
        <button id="dark-toggle" onclick="toggleDark()">noite</button>
      </nav>
    </div>
  </header>

  <main class="site-main">
    <div class="sheet">
      {{ content }}
    </div>
  </main>

  <footer class="site-footer">
    <div class="site-footer-inner">
      escrito por Rafa Mass durante a pandemia de 2020<br>
      extraído do blog <a href="https://fiodoverso.wordpress.com/" rel="noopener noreferrer">fiodoverso.wordpress.com</a>
    </div>
  </footer>
  <script>
  (function() {
    var stored = localStorage.getItem('rfmss-dark');
    if (stored === 'dark') {
      document.body.className = 'dark';
      var btn = document.getElementById('dark-toggle');
      if (btn) btn.textContent = 'dia';
    }
  })();
  function toggleDark() {
    var btn = document.getElementById('dark-toggle');
    if (document.body.className === 'dark') {
      document.body.className = '';
      btn.textContent = 'noite';
      localStorage.setItem('rfmss-dark', 'light');
    } else {
      document.body.className = 'dark';
      btn.textContent = 'dia';
      localStorage.setItem('rfmss-dark', 'dark');
    }
  }
  </script>
</body>
</html>
