---
layout: default
---
<div class="home-header">
  <h1 class="home-title">Ficção</h1>
  <p class="home-sub">{{ site.posts | size }} textos &mdash; 2020</p>
</div>

<div class="post-list">
{% for post in site.posts reversed %}
  <a class="post-item" href="{{ post.url | relative_url }}">
    <time class="post-item-date">{{ post.date | date: "%d.%m" }}</time>
    <span class="post-item-title">{{ post.title }}</span>
  </a>
{% endfor %}
</div>

<style>
  .home-header { margin-bottom: 36px; }
  .home-title {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 2.2rem;
    font-weight: 700;
    color: #1a1a1a;
    letter-spacing: -0.5px;
    margin-bottom: 6px;
  }
  .home-sub {
    font-family: 'Courier New', Courier, monospace;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #555;
  }
  .post-list {
    display: -webkit-flex;
    display: flex;
    -webkit-flex-direction: column;
    flex-direction: column;
  }
  .post-item {
    display: -webkit-flex;
    display: flex;
    -webkit-align-items: baseline;
    align-items: baseline;
    padding: 12px 0;
    border-bottom: 1px solid rgba(0,0,0,0.06);
    color: #1a1a1a;
    text-decoration: none;
    -webkit-transition: background 0.1s;
    transition: background 0.1s;
  }
  .post-item:first-child { border-top: 1px solid rgba(0,0,0,0.06); }
  .post-item:active { background: rgba(0,0,0,0.03); }
  .post-item-date {
    font-family: 'Courier New', Courier, monospace;
    font-size: 0.7rem;
    color: #999;
    letter-spacing: 0.05em;
    -webkit-flex-shrink: 0;
    flex-shrink: 0;
    width: 48px;
  }
  .post-item-title {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1rem;
    color: #1a1a1a;
    line-height: 1.3;
    margin-left: 16px;
  }
  .post-item:hover .post-item-title,
  .post-item:active .post-item-title { color: #d97757; }
</style>
